<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ular - kemis</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow: hidden;
            position: relative;
        }

        /* --- CSS LOADING SCREEN --- */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.2rem;
            color: #4CAF50;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* --- CSS START MENU SCREEN --- */
        #startMenu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 8888;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            text-align: center;
            padding: 20px;
        }

        .menu-title {
            font-size: 2.2rem;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .menu-subtitle {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .btn-start {
            background-color: #4CAF50;
            color: #000;
            border: none;
            padding: 14px 36px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-start:active {
            transform: scale(0.95);
            background-color: #45a049;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.5rem;
            color: #4CAF50;
        }

        .score-board {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        /* Container Pengaturan */
        .settings-container {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 400px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .setting-item input[type="color"] {
            border: 2px solid #4CAF50;
            border-radius: 6px;
            background: transparent;
            width: 32px;
            height: 28px;
            cursor: pointer;
        }

        .setting-item select {
            background-color: #333;
            color: #fff;
            border: 2px solid #4CAF50;
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        canvas {
            border: 3px solid #4CAF50;
            background-color: #000;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            max-width: 100%;
            height: auto;
            touch-action: none;
            border-radius: 12px;
        }

        .controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 8px;
        }

        .btn {
            background-color: #333;
            color: #fff;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .btn:active {
            background-color: #4CAF50;
            color: #000;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">MEMUAT GAME...</div>
    </div>

    <!-- Start Menu -->
    <div id="startMenu">
        <div class="menu-title">Game Ular Iqbal</div>
        <div class="menu-subtitle">Gunakan tombol arah atau usap layar untuk mengontrol ular</div>
        <button class="btn-start" id="btnStartGame">MULAI MAIN</button>
    </div>

    <h1>Game Ular</h1>
    <div class="score-board">Skor: <span id="score">0</span></div>

    <!-- Panel Pengaturan -->
    <div class="settings-container">
        <div class="setting-item">
            <label for="snakeColor">Warna:</label>
            <input type="color" id="snakeColor" value="#4CAF50">
        </div>

        <div class="setting-item">
            <label for="speedSelect">Kecepatan:</label>
            <select id="speedSelect">
                <option value="150">Lambat</option>
                <option value="100" selected>Normal</option>
                <option value="60">Cepat</option>
                <option value="35">Sangat Cepat</option>
                </select>
        </div>

        <div class="setting-item">
            <label for="levelSelect">Level Game:</label>
            <select id="levelSelect">
                <option value="1" selected>Level 1 (Tanpa Musuh)</option>
                <option value="2">Level 2 (1 Musuh)</option>
                <option value="3">Level 3 (2 Musuh)</option>
                <option value="4">Level 4 (3 Musuh)</option>
                <option value="1000">Level 5 (4 Musuh)</option>
            </select>
        </div>

        <div class="setting-item">
            <label for="snakeSkinSelect">Skin Ular:</label>
            <select id="snakeSkinSelect">
                <option value="round" selected>Lingkaran</option>
                <option value="eyes">Dengan Mata</option>
                <option value="star">Bintang</option>
                <option value="glow">Neon Glow</option>
            </select>
        </div>

        <div class="setting-item">
            <label for="foodSkinSelect">Skin Makanan:</label>
            <select id="foodSkinSelect">
                <option value="apple" selected>Apel Merah</option>
                <option value="gold">Emas Glow</option>
                <option value="candy">Permen Pink</option>
                <option value="star">Bintang Emas</option>
            </select>
        </div>
    </div>

    <canvas id="gameCanvas" width="360" height="360"></canvas>

    <!-- Tombol Kontrol Layar Sentuh -->
    <div class="controls">
        <button class="btn btn-up" id="btnUp">▲</button>
        <button class="btn btn-left" id="btnLeft">◄</button>
        <button class="btn btn-right" id="btnRight">►</button>
        <button class="btn btn-down" id="btnDown">▼</button>
    </div>

    <script>
        // Loading Screen
        window.addEventListener("load", () => {
            const loadingScreen = document.getElementById("loadingScreen");
            setTimeout(() => {
                loadingScreen.style.opacity = "0";
                loadingScreen.style.visibility = "hidden";
            }, 1000); 
        });

        const startMenu = document.getElementById("startMenu");
        const btnStartGame = document.getElementById("btnStartGame");

        btnStartGame.addEventListener("click", () => {
            startMenu.style.opacity = "0";
            startMenu.style.visibility = "hidden";
            resetGame();
        });

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const colorPicker = document.getElementById("snakeColor");
        const speedSelect = document.getElementById("speedSelect");
        const levelSelect = document.getElementById("levelSelect");
        const snakeSkinSelect = document.getElementById("snakeSkinSelect");
        const foodSkinSelect = document.getElementById("foodSkinSelect");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 9, y: 9 }];
        let food = { x: 14, y: 14 };
        let enemies = [];
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameStarted = false;
        let snakeColor = colorPicker.value;

        let gameSpeed = parseInt(speedSelect.value);
        let gameInterval = null;

        colorPicker.addEventListener("input", (e) => {
            snakeColor = e.target.value;
        });

        speedSelect.addEventListener("change", (e) => {
            gameSpeed = parseInt(e.target.value);
            speedSelect.blur();
            restartGameLoop();
        });

        levelSelect.addEventListener("change", () => {
            levelSelect.blur();
            resetGame();
        });

        snakeSkinSelect.addEventListener("change", () => snakeSkinSelect.blur());
        foodSkinSelect.addEventListener("change", () => foodSkinSelect.blur());

        function restartGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(drawGame, gameSpeed);
        }

        function initEnemies() {
            enemies = [];
            const level = parseInt(levelSelect.value);
            const count = level - 1;

            for (let i = 0; i < count; i++) {
                let enemyX, enemyY;
                do {
                    enemyX = Math.floor(Math.random() * tileCount);
                    enemyY = Math.floor(Math.random() * tileCount);
                } while ((enemyX === snake[0].x && enemyY === snake[0].y) || (enemyX === food.x && enemyY === food.y));

                const dirs = [-1, 1];
                enemies.push({
                    x: enemyX,
                    y: enemyY,
                    vx: dirs[Math.floor(Math.random() * dirs.length)],
                    vy: dirs[Math.floor(Math.random() * dirs.length)]
                });
            }
        }

        function moveEnemies() {
            if (!gameStarted) return;
            enemies.forEach(enemy => {
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;

                if (enemy.x < 0 || enemy.x >= tileCount) {
                    enemy.vx *= -1;
                    enemy.x += enemy.vx * 2;
                }
                if (enemy.y < 0 || enemy.y >= tileCount) {
                    enemy.vy *= -1;
                    enemy.y += enemy.vy * 2;
                }
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                const centerX = enemy.x * gridSize + gridSize / 2;
                const centerY = enemy.y * gridSize + gridSize / 2;
                const radius = gridSize / 2 - 1;

                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#FF0000";
                ctx.fillStyle = "#D50000";
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "#FFF";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX - 4, centerY - 4);
                ctx.lineTo(centerX + 4, centerY + 4);
                ctx.moveTo(centerX + 4, centerY - 4);
                ctx.lineTo(centerX - 4, centerY + 4);
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawGame() {
            moveSnake();
            moveEnemies();

            if (checkGameOver()) {
                alert("Game Over! Skor Anda: " + score);
                showStartMenu();
                return;
            }

            clearCanvas();
            checkFoodCollision();
            drawFood();
            drawEnemies();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawStarShape(cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawSnake() {
            const skin = snakeSkinSelect.value;

            snake.forEach((segment, index) => {
                const centerX = segment.x * gridSize + gridSize / 2;
                const centerY = segment.y * gridSize + gridSize / 2;
                const radius = gridSize / 2;
                const currentColor = (index === 0) ? lightenColor(snakeColor, 20) : snakeColor;

                ctx.save();

                if (skin === "glow") {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = currentColor;
                    ctx.fillStyle = currentColor;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius - 1, 0, Math.PI * 2);
                    ctx.fill();
                } else if (skin === "star") {
                    drawStarShape(centerX, centerY, 5, radius, radius / 2, currentColor);
                } else {
                    ctx.fillStyle = currentColor;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (skin === "eyes" && index === 0) {
                        ctx.fillStyle = "#FFF";
                        
                        let eyeOffsetX1 = -4, eyeOffsetY1 = -4;
                        let eyeOffsetX2 = 4, eyeOffsetY2 = -4;

                        if (dx === 1) { eyeOffsetX1 = 3; eyeOffsetY1 = -4; eyeOffsetX2 = 3; eyeOffsetY2 = 4; }
                        else if (dx === -1) { eyeOffsetX1 = -3; eyeOffsetY1 = -4; eyeOffsetX2 = -3; eyeOffsetY2 = 4; }
                        else if (dy === 1) { eyeOffsetX1 = -4; eyeOffsetY1 = 3; eyeOffsetX2 = 4; eyeOffsetY2 = 3; }
                        else if (dy === -1) { eyeOffsetX1 = -4; eyeOffsetY1 = -3; eyeOffsetX2 = 4; eyeOffsetY2 = -3; }

                        ctx.beginPath();
                        ctx.arc(centerX + eyeOffsetX1, centerY + eyeOffsetY1, 3, 0, Math.PI * 2);
                        ctx.arc(centerX + eyeOffsetX2, centerY + eyeOffsetY2, 3, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#000";
                        ctx.beginPath();
                        ctx.arc(centerX + eyeOffsetX1, centerY + eyeOffsetY1, 1.5, 0, Math.PI * 2);
                        ctx.arc(centerX + eyeOffsetX2, centerY + eyeOffsetY2, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            });
        }

        function drawFood() {
            const skin = foodSkinSelect.value;
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            const radius = (gridSize / 2) - 1;

            ctx.save();

            if (skin === "gold") {
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#FFD700";
                ctx.fillStyle = "#FFD700";
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (skin === "candy") {
                ctx.fillStyle = "#FF4081";
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#FFF";
                ctx.beginPath();
                ctx.arc(centerX - 2, centerY - 2, radius / 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (skin === "star") {
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#FFCA28";
                drawStarShape(centerX, centerY, 5, radius, radius / 2, "#FFCA28");
            } else {
                ctx.fillStyle = "#FF5252";
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = "#8D6E63";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - radius);
                ctx.lineTo(centerX, centerY - radius - 3);
                ctx.stroke();
            }

            ctx.restore();
        }

        function lightenColor(color, percent) {
            let num = parseInt(color.replace("#",""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                B = (num >> 8 & 0x00FF) + amt,
                G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        function moveSnake() {
            if (!gameStarted) return;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);
            snake.pop();
        }

        function checkFoodCollision() {
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                document.getElementById("score").innerText = score;
                snake.push({});
                generateFood();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                }
            });
            
            enemies.forEach(enemy => {
                if (enemy.x === food.x && enemy.y === food.y) {
                    generateFood();
                }
            });
        }

        function checkGameOver() {
            if (!gameStarted) return false;

            const hitLeft = snake[0].x < 0;
            const hitRight = snake[0].x >= tileCount;
            const hitTop = snake[0].y < 0;
            const hitBottom = snake[0].y >= tileCount;

            if (hitLeft || hitRight || hitTop || hitBottom) return true;

            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) {
                    return true;
                }
            }

            for (let i = 0; i < enemies.length; i++) {
                if (enemies[i].x === snake[0].x && enemies[i].y === snake[0].y) {
                    return true;
                }
            }

            return false;
        }

        function showStartMenu() {
            resetGame();
            startMenu.style.visibility = "visible";
            startMenu.style.opacity = "1";
        }

        function resetGame() {
            snake = [{ x: 9, y: 9 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameStarted = false;
            document.getElementById("score").innerText = score;
            initEnemies();
            generateFood();
        }

        function setDirection(newDx, newDy) {
            if (dx === -newDx && dy === -newDy && gameStarted) return;
            dx = newDx;
            dy = newDy;
            gameStarted = true;
        }

        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener("touchstart", (e) => {
            e.preventDefault();
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            e.preventDefault();
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
        }, { passive: false });

        function handleSwipe(startX, startY, endX, endY) {
            const diffX = endX - startX;
            const diffY = endY - startY;
            const minSwipeDistance = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > minSwipeDistance) {
                    if (diffX > 0) setDirection(1, 0);
                    else setDirection(-1, 0);
                }
            } else {
                if (Math.abs(diffY) > minSwipeDistance) {
                    if (diffY > 0) setDirection(0, 1);
                    else setDirection(0, -1);
                }
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.keyCode === 37 || e.key === "ArrowLeft") setDirection(-1, 0);
            if (e.keyCode === 38 || e.key === "ArrowUp") setDirection(0, -1);
            if (e.keyCode === 39 || e.key === "ArrowRight") setDirection(1, 0);
            if (e.keyCode === 40 || e.key === "ArrowDown") setDirection(0, 1);
        });

        const bindButton = (id, newDx, newDy) => {
            const btn = document.getElementById(id);
            btn.addEventListener("pointerdown", (e) => {
                e.preventDefault();
                setDirection(newDx, newDy);
            });
        };

        bindButton("btnUp", 0, -1);
        bindButton("btnDown", 0, 1);
        bindButton("btnLeft", -1, 0);
        bindButton("btnRight", 1, 0);

        initEnemies();
        restartGameLoop();
    </script>
</body>
</html>
